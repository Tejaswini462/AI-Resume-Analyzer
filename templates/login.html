{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-4 auth-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <span class="hero-tag d-inline-block mb-3">Secure access</span>
                    <h3 class="card-title mb-1">Welcome back</h3>
                    <p class="text-muted mb-0">Sign in to continue analyzing resumes.</p>
                </div>
                <form method="POST" action="{{ url_for('auth.login') }}" class="needs-validation" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                    </div>
                    <button class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    New here?
                    <a href="{{ url_for('auth.register') }}">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
