{% extends 'base.html' %}
{% block title %}Upload Resume{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="mb-4">
            <h2 class="mb-1">Upload Resume</h2>
            <p class="text-muted mb-0">Submit a PDF for ATS analysis and hiring-fit evaluation.</p>
        </div>
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('upload.upload_resume') }}" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Select PDF</label>
                        <input type="file" class="form-control" name="resume" accept="application/pdf" required>
                    </div>
                    <p class="text-muted small mb-3">Upload a valid PDF resume. The file will be stored in the uploads folder and tracked in MySQL.</p>
                    <button class="btn btn-primary">Upload</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
